name: Build BYD Power Manager APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      # 1. Cài đặt Android SDK, Build-Tools và Platform-Tools chuẩn của Google
      - name: Set up Android SDK & Build-Tools
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '11.0'
          accept-android-sdk-licenses: true

      - name: Install SDK Packages (Platform-Tools & Build-Tools 34)
        run: |
          sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      # 2. Tạo Wrapper Gradle 8.5 chuẩn chạy trên nền SDK vừa cài
      - name: Khởi tạo Gradle Wrapper 8.5
        run: |
          gradle wrapper --gradle-version 8.5
          chmod +x ./gradlew

      # 3. Tiến hành biên dịch APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 4. Xuất file APK thành phẩm
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v5
        with:
          name: BYD-Battery-Manager-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
