name: Build BYD 

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Tự động chấp nhận license của Android SDK sẵn có trên máy ảo
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Khởi tạo Gradle Wrapper 8.5 ở hệ thống tạm /tmp để cách ly hoàn toàn
      - name: Khởi tạo Gradle Wrapper 8.5 độc lập
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Đang khởi tạo Gradle Wrapper hoàn toàn độc lập..."
            mkdir -p /tmp/standalone_wrapper
            cd /tmp/standalone_wrapper
            
            # Tạo file settings rỗng để Gradle không soi ngược ra thư mục cha
            touch settings.gradle.kts
            
            # Tạo wrapper bản 8.5
            gradle wrapper --gradle-version 8.5
            
            # Chép toàn bộ bộ file wrapper vừa tạo vào dự án
            cd $GITHUB_WORKSPACE
            cp /tmp/standalone_wrapper/gradlew ./
            cp /tmp/standalone_wrapper/gradlew.bat ./ 2>/dev/null || true
            mkdir -p gradle/wrapper
            cp -r /tmp/standalone_wrapper/gradle/wrapper/* gradle/wrapper/
            
            # Dọn dẹp thư mục tạm
            rm -rf /tmp/standalone_wrapper
          fi
          chmod +x ./gradlew

      # Tiến hành build file APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Xuất file APK thành phẩm
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BYD
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
