name: BYD-vehicle-management

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Tự động đồng ý mọi điều khoản Android SDK có sẵn trên máy ảo GitHub
      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      # Đẻ ra file Wrapper 8.5 ở thư mục tạm để tránh bị dính xung đột cấu hình
      - name: Khởi tạo Gradle Wrapper 8.5
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "Đang khởi tạo Gradle Wrapper..."
            mkdir -p temp_wrapper
            cd temp_wrapper
            gradle wrapper --gradle-version 8.5
            cd ..
            cp temp_wrapper/gradlew ./gradlew
            cp temp_wrapper/gradlew.bat ./gradlew.bat 2>/dev/null || true
            mkdir -p gradle/wrapper
            cp temp_wrapper/gradle/wrapper/gradle-wrapper.jar gradle/wrapper/ 2>/dev/null || true
            rm -rf temp_wrapper
          fi
          chmod +x ./gradlew

      # Biên dịch ra file APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Đóng gói xuất file APK ra cho sếp tải về
      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BYD-vehicle-management
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
