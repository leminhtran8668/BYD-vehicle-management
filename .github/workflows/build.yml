name: Build BYD Vehicle Management APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Chấp nhận License Android SDK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Tải Gradle 8.5 Standalone (Chuẩn đét cho AGP 8.2.2)
        run: |
          echo "Đang tải Gradle 8.5 chính chủ..."
          wget -q https://services.gradle.org/distributions/gradle-8.5-bin.zip -O /tmp/gradle-8.5-bin.zip
          unzip -q /tmp/gradle-8.5-bin.zip -d /tmp/
          rm /tmp/gradle-8.5-bin.zip

      - name: Build Debug APK bằng Gradle 8.5
        run: |
          /tmp/gradle-8.5/bin/gradle assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BYD-Vehicle-Management-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7
